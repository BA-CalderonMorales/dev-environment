name: 'Version Determiner'
description: 'Determines the next version number with prefix support'

inputs:
  source_branch:
    description: 'Source branch for versioning (beta or main)'
    required: true
    default: 'beta'
  initial_version:
    description: 'Initial version to use if no tags exist'
    required: false
    default: 'beta-v0.0.1'

outputs:
  new_version:
    description: 'The next version number'
    value: ${{ steps.version_script.outputs.version }}
  is_beta:
    description: 'Whether this is a beta version'
    value: ${{ steps.version_script.outputs.is_beta }}

runs:
  using: 'composite'
  steps:
    # Show diagnostic information about the branch
    - name: Display branch information
      shell: bash
      run: |
        echo "Source branch: ${{ inputs.source_branch }}"
        echo "Current ref: ${{ github.ref }}"
        echo "Repository: ${{ github.repository }}"
        
    # Try to download pre-built binaries first
    - name: Download Rust binaries artifact
      id: download_artifact
      uses: actions/download-artifact@v4
      with:
        name: rust-binaries
        path: ${{ github.workspace }}/.github/scripts/target/release
      continue-on-error: true
    
    - name: Check if artifact was downloaded
      id: check_artifact
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.github/scripts/target/release/step_version_determiner" ]; then
          echo "artifact_exists=true" >> $GITHUB_OUTPUT
          chmod +x ${{ github.workspace }}/.github/scripts/target/release/step_version_determiner
          echo "Using pre-built Rust binary from artifact"
        else
          echo "artifact_exists=false" >> $GITHUB_OUTPUT
          echo "No pre-built artifact found, will build locally"
        fi

    # Fall back to compiling if no artifact is available
    - name: Setup Rust
      if: steps.check_artifact.outputs.artifact_exists != 'true'
      uses: dtolnay/rust-toolchain@stable
      
    - name: Compile Rust scripts
      if: steps.check_artifact.outputs.artifact_exists != 'true'
      shell: bash
      run: |
        echo "Compiling Rust scripts..."
        cd "${{ github.workspace }}/.github/scripts"
        cargo build --release

    # Run the version determiner script using the release binary
    - name: Determine version
      id: version_script
      shell: bash
      run: ${{ github.workspace }}/.github/scripts/target/release/step_version_determiner
      env:
        INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
        INPUT_INITIAL_VERSION: ${{ inputs.initial_version }}
        RUST_LOG: debug  # Set logging level
        
    # Report the version determination outcome
    - name: Report Version
      shell: bash
      run: |
        echo "## 📊 Version Determination Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version:** \`${{ steps.version_script.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Is Beta:** \`${{ steps.version_script.outputs.is_beta }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Used Pre-built Binary:** \`${{ steps.check_artifact.outputs.artifact_exists == 'true' }}\`" >> $GITHUB_STEP_SUMMARY
