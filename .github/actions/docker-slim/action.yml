name: 'Docker Slim'
description: 'Reduces Docker image size using docker-slim'

inputs:
  image:
    description: 'Docker image to slim'
    required: true
  output_tag:
    description: 'Tag for the slimmed image'
    required: false
    default: 'slim'
  include_paths:
    description: 'Paths to include in the slimmed image (space-separated)'
    required: false
    default: '/usr/src/projects /usr/src/startup /home/devuser/.bashrc /home/devuser/.cargo'
  preserve_perms:
    description: 'Preserve file permissions'
    required: false
    default: 'true'
  dockerhub_username:
    description: 'DockerHub username'
    required: false
  dockerhub_token:
    description: 'DockerHub token'
    required: false
  push_image:
    description: 'Push slimmed image to registry'
    required: false
    default: 'false'

outputs:
  slim_image:
    description: 'The slimmed image name'
    value: ${{ steps.slim.outputs.slim_image }}
  size_reduction:
    description: 'Size reduction percentage'
    value: ${{ steps.slim.outputs.size_reduction }}

runs:
  using: "composite"
  steps:
    # Docker login when credentials are provided
    - name: Docker Login
      if: inputs.dockerhub_username != '' && inputs.dockerhub_token != ''
      shell: bash
      run: |
        echo "${{ inputs.dockerhub_token }}" | docker login -u "${{ inputs.dockerhub_username }}" --password-stdin
        echo "Successfully logged in to DockerHub"

    # Check for local docker-slim script first
    - name: Check for local docker-slim script
      id: check_local_script
      shell: bash
      run: |
        # Check for the local script first
        if [ -f "scripts/slim-docker-image.sh" ]; then
          echo "local_script_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Found local docker-slim script"
        else
          echo "local_script_exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ No local docker-slim script found, will attempt download"
        fi

    # Use local script if available 
    - name: Use local docker-slim script
      if: steps.check_local_script.outputs.local_script_exists == 'true'
      shell: bash
      run: |
        echo "🔧 Using local docker-slim script..."
        mkdir -p ~/bin
        cp scripts/slim-docker-image.sh ~/bin/docker-slim
        chmod +x ~/bin/docker-slim
        echo "PATH=${HOME}/bin:${PATH}" >> $GITHUB_ENV
        echo "✅ Created docker-slim wrapper from local script"

    # Only attempt download if local script isn't available
    - name: Download docker-slim binary
      if: steps.check_local_script.outputs.local_script_exists != 'true'
      shell: bash
      run: |
        echo "🔍 Attempting to download docker-slim..."
        
        # Create bin directory
        mkdir -p ~/bin
        
        # Set version - using a known stable version
        DOCKERSLIM_VERSION="1.40.0"
        
        # Try multiple download URLs with robust error handling
        DOWNLOAD_URLS=(
          "https://downloads.dockerslim.com/releases/${DOCKERSLIM_VERSION}/dist_linux.tar.gz" 
          "https://github.com/docker-slim/docker-slim/releases/download/${DOCKERSLIM_VERSION}/dist_linux.tar.gz"
        )
        
        TEMP_DIR=$(mktemp -d)
        SUCCESS=false
        
        for URL in "${DOWNLOAD_URLS[@]}"; do
          echo "📥 Trying download from: $URL"
          
          # Download with retry and timeout
          if curl -L --retry 3 --connect-timeout 10 -o "${TEMP_DIR}/docker-slim.tar.gz" "$URL"; then
            # Verify downloaded file size
            FILE_SIZE=$(stat -c%s "${TEMP_DIR}/docker-slim.tar.gz")
            if [ "$FILE_SIZE" -gt 1000000 ]; then # At least 1MB
              echo "✅ Download successful (${FILE_SIZE} bytes)"
              
              # Extract the archive
              echo "📦 Extracting docker-slim archive..."
              if tar -xzf "${TEMP_DIR}/docker-slim.tar.gz" -C "${TEMP_DIR}"; then
                # Find and copy the binaries
                if [ -d "${TEMP_DIR}/dist_linux" ]; then
                  cp "${TEMP_DIR}/dist_linux/docker-slim" "${HOME}/bin/"
                  cp "${TEMP_DIR}/dist_linux/docker-slim-sensor" "${HOME}/bin/"
                  chmod +x "${HOME}/bin/docker-slim" "${HOME}/bin/docker-slim-sensor"
                  echo "PATH=${HOME}/bin:${PATH}" >> $GITHUB_ENV
                  echo "✅ docker-slim installed successfully"
                  SUCCESS=true
                  break
                else
                  echo "❌ Expected directory structure not found in downloaded archive"
                fi
              else
                echo "❌ Failed to extract docker-slim archive"
              fi
            else
              echo "⚠️ Downloaded file too small (${FILE_SIZE} bytes), likely an error page"
            fi
          else
            echo "❌ Download failed from $URL"
          fi
        done
        
        # Clean up temp directory
        rm -rf "${TEMP_DIR}"
        
        # If all methods failed, exit with error
        if [ "$SUCCESS" != "true" ]; then
          echo "❌ Failed to download and install docker-slim from all sources"
          echo "Please install docker-slim manually or fix the scripts/slim-docker-image.sh"
          exit 1
        fi

    - name: Process Docker image with slim
      id: slim
      shell: bash
      run: |
        # Verify docker-slim is available
        if ! command -v docker-slim &>/dev/null; then
          echo "❌ docker-slim not found in PATH!"
          echo "Current PATH: $PATH"
          echo "Contents of ~/bin:"
          ls -la ~/bin || echo "bin directory doesn't exist"
          exit 1
        fi
        
        # Ensure the image exists locally
        echo "📥 Pulling image ${{ inputs.image }}..."
        docker pull ${{ inputs.image }}
        
        # Prepare output image name
        IMAGE_NAME="${{ inputs.image }}"
        OUTPUT_TAG="${{ inputs.output_tag }}"
        OUTPUT_IMAGE="${IMAGE_NAME%:*}:${OUTPUT_TAG}"
        
        echo "🔄 Processing image $IMAGE_NAME to $OUTPUT_IMAGE"
        
        # Convert include_paths to docker-slim format
        INCLUDE_ARGS=""
        for path in ${{ inputs.include_paths }}; do
          INCLUDE_ARGS="$INCLUDE_ARGS --include-path $path"
        done
        
        # Run docker-slim with proper error handling
        echo "🏃 Running docker-slim..."
        
        # Add debug information
        docker-slim --version
        
        # Run docker-slim with full command output for debugging
        set -x
        
        # Execute docker-slim and fail explicitly if it doesn't work
        if ! docker-slim build \
          --http-probe=false \
          --continue-after=900 \
          --preserve-path-perms=${{ inputs.preserve_perms }} \
          $INCLUDE_ARGS \
          --tag $OUTPUT_IMAGE \
          --dockerfile-tweaks-only=false \
          --cmd "/bin/bash" \
          --entrypoint "/bin/bash" \
          $IMAGE_NAME
        then
          echo "❌ docker-slim execution failed"
          exit 1
        fi
        
        set +x
        
        # Verify the slimmed image exists and is different from original
        echo "🔍 Verifying slimmed image..."
        if ! docker image inspect $OUTPUT_IMAGE &>/dev/null; then
          echo "❌ Slimmed image was not created successfully"
          exit 1
        fi
        
        # Report image sizes
        ORIGINAL_SIZE=$(docker image ls --format "{{.Size}}" $IMAGE_NAME)
        SLIM_SIZE=$(docker image ls --format "{{.Size}}" $OUTPUT_IMAGE)
        
        # Calculate size reduction percentage
        ORIGINAL_KB=$(echo $ORIGINAL_SIZE | sed 's/[^0-9]//g')
        SLIM_KB=$(echo $SLIM_SIZE | sed 's/[^0-9]//g')
        
        if [ -n "$ORIGINAL_KB" ] && [ "$ORIGINAL_KB" -gt 0 ]; then
          REDUCTION=$(( (ORIGINAL_KB - SLIM_KB) * 100 / ORIGINAL_KB ))
          
          # Verify actual size reduction occurred
          if [ "$REDUCTION" -lt 5 ]; then
            echo "⚠️ Warning: Very small size reduction ($REDUCTION%). Docker-slim may not have worked properly."
            echo "Original: $ORIGINAL_SIZE, Slim: $SLIM_SIZE"
          fi
        else
          echo "❌ Could not determine image sizes properly"
          exit 1
        fi
        
        # Set outputs
        echo "slim_image=$OUTPUT_IMAGE" >> $GITHUB_OUTPUT
        echo "size_reduction=$REDUCTION%" >> $GITHUB_OUTPUT
        
        # Push slimmed image if requested
        if [ "${{ inputs.push_image }}" = "true" ]; then
          echo "📤 Pushing slimmed image to registry..."
          if ! docker push $OUTPUT_IMAGE; then
            echo "❌ Failed to push slimmed image"
            exit 1
          fi
        fi
        
        # Add summary
        echo "## 🐳 Docker Slim Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Original Image: \`$IMAGE_NAME\` - Size: $ORIGINAL_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Slimmed Image: \`$OUTPUT_IMAGE\` - Size: $SLIM_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Size Reduction: $REDUCTION%" >> $GITHUB_STEP_SUMMARY
