name: 'Docker Slim'
description: 'Reduces Docker image size using docker-slim'

inputs:
  image:
    description: 'Docker image to slim'
    required: true
  output_tag:
    description: 'Tag for the slimmed image'
    required: false
    default: 'slim'
  include_paths:
    description: 'Paths to include in the slimmed image (space-separated)'
    required: false
    default: '/usr/src/projects /usr/src/startup /home/devuser/.bashrc /home/devuser/.cargo'
  preserve_perms:
    description: 'Preserve file permissions'
    required: false
    default: 'true'
  dockerhub_username:
    description: 'DockerHub username'
    required: false
  dockerhub_token:
    description: 'DockerHub token'
    required: false
  push_image:
    description: 'Push slimmed image to registry'
    required: false
    default: 'false'

outputs:
  slim_image:
    description: 'The slimmed image name'
    value: ${{ steps.slim.outputs.slim_image }}
  size_reduction:
    description: 'Size reduction percentage'
    value: ${{ steps.slim.outputs.size_reduction }}

runs:
  using: "composite"
  steps:
    # Docker login when credentials are provided
    - name: Docker Login
      if: inputs.dockerhub_username != '' && inputs.dockerhub_token != ''
      shell: bash
      run: |
        echo "${{ inputs.dockerhub_token }}" | docker login -u "${{ inputs.dockerhub_username }}" --password-stdin
        echo "Successfully logged in to DockerHub"

    # Install docker-slim directly from GitHub releases
    - name: Install docker-slim
      shell: bash
      run: |
        echo "Installing docker-slim directly from GitHub releases..."
        
        # Create bin directory
        mkdir -p ~/bin
        
        # Set version - using a known stable version
        DOCKERSLIM_VERSION="1.40.0"
        
        # Direct download of binary (more reliable than the install script)
        echo "Downloading docker-slim ${DOCKERSLIM_VERSION}..."
        TEMP_DIR=$(mktemp -d)
        
        # Download with proper error handling
        if ! curl -L -o "${TEMP_DIR}/docker-slim.tar.gz" "https://github.com/docker-slim/docker-slim/releases/download/${DOCKERSLIM_VERSION}/dist_linux.tar.gz"; then
          echo "Failed to download docker-slim from GitHub. Trying DockerHub mirror..."
          
          # Try alternative download from DockerHub (as a fallback)
          if ! curl -L -o "${TEMP_DIR}/docker-slim.tar.gz" "https://downloads.dockerslim.com/releases/${DOCKERSLIM_VERSION}/dist_linux.tar.gz"; then
            echo "Failed to download docker-slim from all sources"
            exit 1
          fi
        fi
        
        # Extract and install with error checking
        if ! tar -xzf "${TEMP_DIR}/docker-slim.tar.gz" -C "${TEMP_DIR}"; then
          echo "Failed to extract docker-slim archive"
          exit 1
        fi
        
        # Find and copy the binaries
        if [ -d "${TEMP_DIR}/dist_linux" ]; then
          cp "${TEMP_DIR}/dist_linux/docker-slim" "${HOME}/bin/"
          cp "${TEMP_DIR}/dist_linux/docker-slim-sensor" "${HOME}/bin/"
          chmod +x "${HOME}/bin/docker-slim" "${HOME}/bin/docker-slim-sensor"
        else
          echo "Expected directory structure not found in downloaded archive"
          find "${TEMP_DIR}" -type f | sort
          exit 1
        fi
        
        # Update PATH
        export PATH="${HOME}/bin:${PATH}"
        echo "PATH=${HOME}/bin:${PATH}" >> $GITHUB_ENV
        
        # Verify installation
        if command -v docker-slim >/dev/null 2>&1; then
          echo "docker-slim installed successfully at $(which docker-slim)"
          docker-slim --version
        else
          echo "docker-slim installation failed"
          echo "Contents of bin directory:"
          ls -la ~/bin/
          exit 1
        fi
        
        # Clean up
        rm -rf "${TEMP_DIR}"

    # Use pre-built script if available as a fallback
    - name: Use existing docker-slim script if available
      if: failure()
      shell: bash
      run: |
        echo "Trying to use local docker-slim script..."
        if [ -f "scripts/slim-docker-image.sh" ]; then
          echo "Found local script, copying it to ~/bin"
          cp scripts/slim-docker-image.sh ~/bin/docker-slim
          chmod +x ~/bin/docker-slim
          echo "PATH=${HOME}/bin:${PATH}" >> $GITHUB_ENV
          echo "Created docker-slim wrapper from local script"
        else
          echo "No local docker-slim script found at scripts/slim-docker-image.sh"
          exit 1
        fi

    - name: Process Docker image with slim
      id: slim
      shell: bash
      run: |
        # Ensure the image exists locally
        echo "Pulling image ${{ inputs.image }}..."
        docker pull ${{ inputs.image }}
        
        # Prepare output image name
        IMAGE_NAME="${{ inputs.image }}"
        OUTPUT_TAG="${{ inputs.output_tag }}"
        OUTPUT_IMAGE="${IMAGE_NAME%:*}:${OUTPUT_TAG}"
        
        echo "Processing image $IMAGE_NAME to $OUTPUT_IMAGE"
        
        # Convert include_paths to docker-slim format
        INCLUDE_ARGS=""
        for path in ${{ inputs.include_paths }}; do
          INCLUDE_ARGS="$INCLUDE_ARGS --include-path $path"
        done
        
        # Run docker-slim with proper error handling
        echo "Running docker-slim..."
        set -x  # Enable command echo for debugging
        
        docker-slim --version || echo "Warning: docker-slim version check failed"
        
        if ! docker-slim build \
          --http-probe=false \
          --continue-after=900 \
          --preserve-path-perms=${{ inputs.preserve_perms }} \
          $INCLUDE_ARGS \
          --tag $OUTPUT_IMAGE \
          --dockerfile-tweaks-only=false \
          --cmd "/bin/bash" \
          --entrypoint "/bin/bash" \
          $IMAGE_NAME
        then
          echo "docker-slim execution failed"
          exit 1
        fi
        
        set +x  # Disable command echo
        
        # Verify the slimmed image exists
        if ! docker image inspect $OUTPUT_IMAGE &>/dev/null; then
          echo "Slimmed image was not created successfully"
          exit 1
        fi
        
        # Report image sizes
        ORIGINAL_SIZE=$(docker image ls --format "{{.Size}}" $IMAGE_NAME)
        SLIM_SIZE=$(docker image ls --format "{{.Size}}" $OUTPUT_IMAGE)
        
        # Calculate size reduction percentage
        ORIGINAL_KB=$(echo $ORIGINAL_SIZE | sed 's/[^0-9]//g')
        SLIM_KB=$(echo $SLIM_SIZE | sed 's/[^0-9]//g')
        
        if [ -n "$ORIGINAL_KB" ] && [ "$ORIGINAL_KB" -gt 0 ]; then
          REDUCTION=$(( (ORIGINAL_KB - SLIM_KB) * 100 / ORIGINAL_KB ))
        else
          REDUCTION=0
        fi
        
        echo "slim_image=$OUTPUT_IMAGE" >> $GITHUB_OUTPUT
        echo "size_reduction=$REDUCTION%" >> $GITHUB_OUTPUT
        
        # Push slimmed image if requested
        if [ "${{ inputs.push_image }}" = "true" ]; then
          echo "Pushing slimmed image to registry..."
          if ! docker push $OUTPUT_IMAGE; then
            echo "Failed to push slimmed image"
            exit 1
          fi
        fi
        
        # Add summary
        echo "## 🐳 Docker Slim Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Original Image: \`$IMAGE_NAME\` - Size: $ORIGINAL_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Slimmed Image: \`$OUTPUT_IMAGE\` - Size: $SLIM_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Size Reduction: $REDUCTION%" >> $GITHUB_STEP_SUMMARY
