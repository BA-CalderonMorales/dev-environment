name: 'DockerHub Build'
description: 'Builds and pushes Docker images to registry with version awareness'

inputs:
  environment:
    description: 'Target environment (dev/beta/prod)'
    required: true
  base_image:
    description: 'Base image tag to use'
    required: true
  version:
    description: 'Version to tag image with'
    required: true

outputs:
  image_changed:
    description: 'Whether the image was changed'
    value: ${{ steps.build_output.outputs.image_changed }}

runs:
  using: 'composite'
  steps:
    # Direct Docker login method that matches setup-docker approach
    - name: Docker Login
      shell: bash
      run: |
        # Login to DockerHub directly with credentials
        echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
        echo "Successfully logged in to DockerHub"

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: cmoe640/dev-environment
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}},value=${{ inputs.version }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
          type=raw,value=pipeline,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/beta' }}

    # Prepare the Dockerfile without fallback
    - name: Prepare Docker build
      shell: bash
      run: |
        # Create directory for generated Dockerfile
        mkdir -p distributions/dockerhub/generated
        
        # Check if Dockerfile exists and fail if not
        if [ ! -f "distributions/dockerhub/Dockerfile" ]; then
          echo "::error::Dockerfile not found at distributions/dockerhub/Dockerfile"
          ls -la distributions/dockerhub/ || echo "Directory not found"
          exit 1
        fi
        
        # Copy Dockerfile to environment-specific path
        cp distributions/dockerhub/Dockerfile distributions/dockerhub/generated/Dockerfile.${{ inputs.environment }}
        echo "✅ Copied Dockerfile to generated location"

    # Build and push using standard docker command instead of action
    - name: Build and push Docker image
      id: build
      shell: bash
      run: |
        # Build the Docker image - fixed repository name
        docker buildx build \
          --push \
          --platform linux/amd64 \
          --tag cmoe640/dev-environment:${{ inputs.base_image }} \
          --file ./distributions/dockerhub/generated/Dockerfile.${{ inputs.environment }} \
          --cache-from type=registry,ref=cmoe640/dev-environment:${{ inputs.base_image }} \
          --label "org.opencontainers.image.version=${{ inputs.version }}" \
          .
        
        # Check if build was successful
        if [ $? -eq 0 ]; then
          echo "Docker image successfully built and pushed"
        else
          echo "Docker build failed"
          exit 1
        fi

    # Set output
    - name: Set build output
      id: build_output
      shell: bash
      run: |
        echo "image_changed=true" >> $GITHUB_OUTPUT
        
        # Add summary without exposing any sensitive data
        echo "## 🐳 Docker Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment:** \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Base Image:** \`${{ inputs.base_image }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Image built successfully" >> $GITHUB_STEP_SUMMARY
