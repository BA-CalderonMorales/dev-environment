name: 'DockerHub Build'
description: 'Builds and pushes Docker images to registry with version awareness'

inputs:
  environment:
    description: 'Target environment (dev/beta/prod)'
    required: true
  base_image:
    description: 'Base image tag to use'
    required: true
  version:
    description: 'Version to tag image with'
    required: true

outputs:
  image_changed:
    description: 'Whether the image was changed'
    value: ${{ steps.build.outputs.image_changed }}

runs:
  using: 'composite'
  steps:
    # Secure Docker login - avoid output to logs
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ba-calderonmorales/dev-environment
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}},value=${{ inputs.version }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
          type=raw,value=pipeline,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/beta' }}

    # Check if Dockerfile exists without generating debug output
    - name: Prepare Docker build
      shell: bash
      run: |
        # Create directory for generated Dockerfile
        mkdir -p distributions/dockerhub/generated
        
        # Copy Dockerfile to environment-specific path
        if [ -f "distributions/dockerhub/Dockerfile" ]; then
          cp distributions/dockerhub/Dockerfile distributions/dockerhub/generated/Dockerfile.${{ inputs.environment }}
        else
          # Create minimal Dockerfile if the original doesn't exist
          cat > distributions/dockerhub/generated/Dockerfile.${{ inputs.environment }} << EOF
# Generated fallback Dockerfile
FROM ubuntu:22.04
LABEL maintainer="BA-CalderonMorales"
LABEL version="${{ inputs.version }}"
LABEL description="Fallback development environment container"
CMD ["/bin/bash"]
EOF
        fi

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./distributions/dockerhub/generated/Dockerfile.${{ inputs.environment }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Explicitly set outputs but no debug/logging of secrets
        outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=personal dev environment for easy setup/work from anywhere.

    # Set output without exposing secrets
    - name: Set build output
      id: build
      shell: bash
      run: |
        echo "image_changed=true" >> $GITHUB_OUTPUT
        
        # Add summary without exposing any sensitive data
        echo "## 🐳 Docker Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment:** \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Version Tag:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Image built successfully" >> $GITHUB_STEP_SUMMARY
